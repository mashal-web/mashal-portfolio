name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Clear stale in-progress Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = '9220d2459c50143439121cfa011fa723eaa74f69';
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner, repo, environment: 'github-pages', per_page: 100
            });
            const stale = deployments.filter(d => d.sha === staleSha);
            for (const deployment of stale) {
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                owner, repo, deployment_id: deployment.id, per_page: 100
              });
              if (statuses.some(s => s.state === 'in_progress')) {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: deployment.id, state: 'inactive',
                  description: 'Clearing stale deployment blocking the latest Pages release.'
                });
                core.info(`Marked stale deployment ${deployment.id} inactive.`);
              }
            }
            if (stale.length === 0) core.info('No matching stale repository deployment found; continuing.');
      - name: Cancel stale GitHub Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const staleSha = '9220d2459c50143439121cfa011fa723eaa74f69';
            try {
              await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                { owner, repo, pages_deployment_id: staleSha }
              );
              core.info(`Cancelled stale Pages deployment ${staleSha}.`);
            } catch (error) {
              if (error.status === 404 || /already cleared|it's finished|is finished/i.test(error.message || '')) {
                core.info('The stale Pages deployment is already finished or cleared; continuing to deploy the latest commit.');
              } else {
                throw error;
              }
            }
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
